<script>
    const div = document.createElement("div")
    console.log(div)
    div.className = "heading"
    div.id = Math.floor(Math.random() * 1000 + 1)
    div.setAttribute("title", "this is heading")
    div.style.backgroundColor = "red"
    div.style.padding = "20px"
    div.style.fontSize = "30px"
    div.innerText = "this is heading"
    const addtext = document.createTextNode("this is text node")
    div.appendChild(addtext)
    document.body.appendChild(div)
</script>
