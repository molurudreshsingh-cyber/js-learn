<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom Learning 2</title>
</head>
<body style="background-color:#212121; color:#ffff">
    <div class="parent">
        <div class="day">monday</div>
        <div class="day">tuesday</div>
        <div class="day">wednesday</div>
        <div class="day">thursday</div>
    </div>


</body>
<script>
    const parent = document.querySelector(".parent")
    console.log(parent);
    console.log(parent.children);
    console.log(parent.children[2].innerHTML)

    for (let i = 0; i < parent.children.length; i++) {
        parent.children[i].style.backgroundColor = "red"
        console.log(parent.children[i].innerText);
    }

   // parent.children[0].style.color = "green"

    const dayOne = document.querySelector(".day")
    console.log(dayOne)
    console.log(dayOne.innerText)
    console.log(dayOne.innerHTML)
    console.log(dayOne.parentElement)
    console.log(dayOne.nextElementSibling)
</script>
</html>
